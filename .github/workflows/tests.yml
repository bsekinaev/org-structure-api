name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    name: PostgreSQL / Alembic / pytest
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: org_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d org_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/org_db_test
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Check migration head
        run: python -m alembic current --check-heads
      - name: Run regression and integration tests
        run: python -m pytest tests/ -q

  docker-smoke:
    name: Docker Compose / migrations / API / pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: org-gh01-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create disposable example environment
        run: cp .env.example .env
      - name: Validate Compose and build application image
        run: |
          docker compose config --quiet
          docker compose build app
      - name: Start isolated PostgreSQL and create test database
        run: |
          set -euo pipefail
          docker compose up -d db
          for attempt in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U postgres -d org_db; then
              break
            fi
            sleep 2
          done
          docker compose exec -T db pg_isready -U postgres -d org_db
          docker compose exec -T db psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE org_db_test'
      - name: Migrate and test isolated Docker database
        run: |
          set -euo pipefail
          docker compose run --rm -e DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/org_db_test app python -m alembic upgrade head
          docker compose run --rm -e DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/org_db_test app python -m alembic current --check-heads
          docker compose run --rm -e DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/org_db_test app python -m pytest tests/ -q
      - name: Smoke-check Docker API and PostgreSQL driver
        run: |
          set -euo pipefail
          docker compose up -d app
          for attempt in $(seq 1 30); do
            if docker compose exec -T app python -c 'from urllib.request import urlopen; assert urlopen("http://127.0.0.1:8000/").status == 200; assert urlopen("http://127.0.0.1:8000/docs").status == 200'; then
              docker compose exec -T app python -c 'from sqlalchemy import text; from app.database import engine; c = engine.connect(); assert c.execute(text("SELECT 1")).scalar() == 1; c.close()'
              exit 0
            fi
            sleep 2
          done
          echo "API did not pass HTTP smoke"
          docker compose logs --no-color app
          exit 1
      - name: Clean up disposable Docker volumes
        if: always()
        run: docker compose down -v --remove-orphans
